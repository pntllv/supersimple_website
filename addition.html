<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addition</title>
    <link rel="stylesheet" href="addition.css">
</head>
<body>
    <!-- Button with onclick event -->
    <button onclick="doSomething() "style="font-size:60px; background-color:lightgreen; color:white; border-radius:40px">Click me</button>
    <p id="greeting">Hello</p>
    <script>
        function doSomething() {
            document.getElementById("greeting").innerHTML = "Goodbye";
        }
    </script>

    <!-- form list-->
     <form action="index.php" method="POST" enctype="multipart/form-data">
        
        <label for="username">username:</label>
        <input type="text" id="username" placeholder="SpongeBob" minlength="6" maxlength="15"required><br>

        <label for="password">password:</label>
        <input type="password" id="password" placeholder="Create a password"minlength="8" maxlength="20" required><br>

        <label for="email">email:</label>
        <input type="email" id="email" placeholder="SSquarepants@gmail.com" required><br>

        <label for="phone">phone:</label>
        <input type="tel" id="phone" placeholder="123-456-7890" pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}" required><br>

        <label for="bday">birthdate:</label>
        <input type="date" id="bday" required><br>

        <label for="quantity">quantity:</label>
        <input type="number" id="quantity" min="0" max="99" required><br>

        <label for="title">title:</label>
        <label for="Mr">Mr.</label>
        <input type="radio" id="Mr." value="Mr." name="title">
        <label for="Ms.">Ms.</label>
        <input type="radio" id="Ms." value="Ms." name="title">
        <label for="PhD.">PhD.</label>
        <input type="radio" id="PhD." value="PhD." name="title"><br>

        <label for="payment">payment:</label>
        <select id="payment">
            <option value="visa">Visa</option>
            <option value="mastercard">Mastercard</option>
            <option value="giftcard">Gift Card</option>
        </select><br>

        <label for="subscribe">subscribe:</label>
        <input type="checkbox" id="subscribe"><br>

        <label for="comment">comment:</label>
        <textarea id="comment" row="3" cols="25"></textarea><br>

        <label for="file">file:</label>
        <input type="file" id="file" accept="image/png, image/jpeg"><br>

        <input type="reset"><br>
        <input type="submit">
     </form>
</body>
</html>
